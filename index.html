<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al-Shifa Medical Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Al-Shifa Medical Store</h1>
    <p>Quality Medical Instruments</p>
    <p>Cart: <span id="cart-count">0</span> items</p>
  </header>

  <main>
    <h2>Our Products</h2>

    <div class="filters">
      <input type="text" id="search-box" placeholder="Product search karein..." oninput="showProducts()">
      <select id="category-filter" onchange="showProducts()">
        <option value="all">Saari Categories</option>
      </select>
    </div>

    <div class="products" id="product-list"></div>

    <h2 class="cart-title">Your Cart</h2>
    <div id="cart-box"></div>

    <h2 class="cart-title">Order Details</h2>
    <div id="checkout-box">
      <input type="text" id="cust-name" placeholder="Aap ka naam">
      <input type="tel" id="cust-phone" placeholder="Phone number">
      <textarea id="cust-address" placeholder="Poora address (shehar, mohalla, ghar number)"></textarea>
      <button onclick="placeOrder()">Order Karein (WhatsApp par)</button>
    </div>
  </main>

  <footer>
    <p>WhatsApp: <a href="https://wa.me/923004980196">03004980196</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
